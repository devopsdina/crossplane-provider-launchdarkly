                  "name": "Team Maintained View",
                  "project_key": "example-project",
                  "tags": [
                    "team-managed"
                  ]
                }
        argumentDocs:
            archived: (Boolean) Whether the view is archived.
            description: (String) The view's description.
            id: (String) The ID of this resource.
            key: (String) The view's unique key. A change in this field will force the destruction of the existing resource and the creation of a new one.
            maintainer_id: (String) The member ID of the maintainer for this view. Exactly one of maintainer_id and maintainer_team_key must be set.
            maintainer_team_key: (String) The team key of the maintainer team for this view. Exactly one of maintainer_id and maintainer_team_key must be set.
            name: (String) The view's name.
            project_key: (String) The project key. A change in this field will force the destruction of the existing resource and the creation of a new one.
            tags: (Set of String) Tags associated with your resource.
        importStatements: []
    launchdarkly_view_filter_links:
        subCategory: ""
        description: 'Provides a LaunchDarkly view filter links resource for linking resources to views using filter expressions. -> Note: Views are available to customers on an Enterprise LaunchDarkly plan. To learn more, read about our pricing https://launchdarkly.com/pricing/. To upgrade your plan, contact LaunchDarkly Sales https://launchdarkly.com/contact-sales/. ~> Beta: This resource uses a beta API. Beta resources may change or be removed in future versions. This resource allows you to link all flags and/or segments matching a filter expression to a specific view. The filter is resolved at apply time — the backend finds all resources matching the filter and links them to the view. -> Note: Filter-based links are point-in-time. By default, filters are resolved only when this resource is created or updated (for example, when flag_filter changes). Set reconcile_on_apply = true to force re-resolution on every terraform apply. When to use which resource view_links: You know the exact flag/segment keys to link. Terraform tracks the explicit list and detects drift if links are removed externally.view_filter_links (this resource): You want to link all resources matching a dynamic query (e.g. all flags tagged "frontend"). No drift detection on resolved keys. By default, only resource argument changes trigger updates; set reconcile_on_apply to refresh links every apply.view_keys on individual resources: Each flag/segment declares its own view membership. Best for modular Terraform structures. -> Warning: Do not use view_filter_links and view_links targeting the same view and resource type, as conflicts may cause unexpected behavior.'
        name: launchdarkly_view_filter_links
        title: launchdarkly_view_filter_links Resource - launchdarkly
        examples:
            - name: frontend_flags
              manifest: |-
                {
                  "flag_filter": "tags:frontend",
                  "project_key": "my-project",
                  "view_key": "frontend-team"
                }
            - name: platform_resources
              manifest: |-
                {
                  "flag_filter": "tags:platform",
                  "project_key": "my-project",
                  "segment_filter": "tags anyOf [\"platform\"]",
                  "segment_filter_environment_id": "${launchdarkly_project.my_project.environments[0].client_side_id}",
                  "view_key": "platform-team"
                }
              references:
                segment_filter_environment_id: launchdarkly_project.my_project.environments[0].client_side_id
            - name: beta_segments
              manifest: |-
                {
                  "project_key": "my-project",
                  "segment_filter": "tags anyOf [\"beta\"]",
                  "segment_filter_environment_id": "${launchdarkly_project.my_project.environments[0].client_side_id}",
                  "view_key": "beta-program"
                }
              references:
                segment_filter_environment_id: launchdarkly_project.my_project.environments[0].client_side_id
        argumentDocs:
            flag_filter: (String) A filter expression to match feature flags for linking to the view. Uses the same filter syntax as the flag list API endpoint (e.g. tags:frontend, status:active).
            id: (String) The ID of this resource.
            project_key: (String) The project key. A change in this field will force the destruction of the existing resource and the creation of a new one.
            reconcile_on_apply: to refresh links every apply.
            resolved_at: (String) Timestamp of the last successful filter resolution. This value updates when the resource is created or updated, and on every apply when reconcile_on_apply is true.
            segment_filter: (String) A filter expression to match segments for linking to the view. Uses the segment query filter syntax (e.g. tags anyOf ["backend"], query = "my-segment", unbounded = true). Requires segment_filter_environment_id to be set.
            segment_filter_environment_id: (String) The environment ID to use when resolving segment filters. Required when segment_filter is set. This is the environment's opaque ID (e.g. from launchdarkly_project.environments[*].client_side_id).
            view_filter_links: (this resource)
            view_key: (String) The view key to link resources to. A change in this field will force the destruction of the existing resource and the creation of a new one.
            view_keys: on individual resources
        importStatements: []
    launchdarkly_view_links:
        subCategory: ""
        description: 'Provides a LaunchDarkly view links resource for managing bulk resource linkage to views. -> Note: Views are available to customers on an Enterprise LaunchDarkly plan. To learn more, read about our pricing https://launchdarkly.com/pricing/. To upgrade your plan, contact LaunchDarkly Sales https://launchdarkly.com/contact-sales/. ~> Beta: This resource uses a beta API. Beta resources may change or be removed in future versions. This resource allows you to efficiently link multiple flags and/or segments to a specific view. This is particularly useful for administrators organizing resources by team or deployment unit. -> Note: This resource manages ALL links for the specified resource types within a view. Adding or removing items from the configuration will link or unlink those resources accordingly. Alternative Approach: view_keys on Individual Resources For modular Terraform configurations where flags and segments are defined in separate files or modules, you can use the view_keys field directly on the resource instead of using this centralized view_links resource: Feature Flags: Use the view_keys attribute on launchdarkly_feature_flag resourcesSegments: Use the view_keys attribute on launchdarkly_segment resources When to use view_links (this resource): Managing many flags/segments for a single view (bulk operations)Centralized view management across your infrastructureAdministrative view organization When to use view_keys on individual resources: Modular Terraform structures with separate files per flag/segmentEach team/module manages their own resourcesWant view membership defined alongside the resource -> Warning: Do not use both view_links and view_keys to manage the same flag or segment''s view associations. Mixed ownership can cause conflicts; when detected, Terraform logs a warning and reconciles to the managing resource''s configured associations. Choose one approach per resource. See the feature flag resource documentation and segment resource documentation for details on the view_keys attribute.'
        name: launchdarkly_view_links
        title: launchdarkly_view_links Resource - launchdarkly
        examples:
            - name: frontend_team
              manifest: |-
                {
                  "flags": [
                    "feature-login",
                    "feature-dashboard",
                    "feature-payments",
                    "feature-checkout",
                    "feature-profile",
                    "feature-notifications",
                    "feature-search",
                    "feature-filters",
                    "feature-analytics",
                    "feature-dark-mode"
                  ],
                  "project_key": "my-project",
                  "segments": [
                    {
                      "environment_id": "507f1f77bcf86cd799439011",
                      "segment_key": "frontend-beta-users"
                    },
                    {
                      "environment_id": "507f1f77bcf86cd799439011",
                      "segment_key": "premium-customers"
                    }
                  ],
                  "view_key": "frontend-team"
                }
            - name: mobile_team
              manifest: |-
                {
                  "flags": [
                    "feature-mobile-login",
                    "feature-push-notifications",
                    "feature-offline-mode",
                    "feature-biometric-auth",
                    "feature-mobile-payments",
                    "feature-app-rating"
                  ],
                  "project_key": "my-project",
                  "view_key": "mobile-team"
                }
            - name: shared_features
              manifest: |-
                {
                  "flags": [
                    "feature-maintenance-mode",
                    "feature-emergency-banner",
                    "feature-api-throttling",
                    "feature-logging-level"
                  ],
                  "project_key": "my-project",
                  "view_key": "shared-features"
                }
            - name: backend_team
              manifest: |-
                {
                  "flags": [
                    "feature-database-migration",
                    "feature-cache-optimization",
                    "feature-api-versioning"
                  ],
                  "project_key": "my-project",
                  "segments": [
                    {
                      "environment_id": "507f1f77bcf86cd799439011",
                      "segment_key": "high-volume-api-users"
                    },
                    {
                      "environment_id": "507f1f77bcf86cd799439022",
                      "segment_key": "database-migration-pilot"
                    }
                  ],
                  "view_key": "backend-team"
                }
            - name: segments_only
              manifest: |-
                {
                  "project_key": "my-project",
                  "segments": [
                    {
                      "environment_id": "507f1f77bcf86cd799439011",
                      "segment_key": "vip-customers"
                    },
                    {
                      "environment_id": "507f1f77bcf86cd799439011",
                      "segment_key": "enterprise-customers"
                    },
                    {
                      "environment_id": "507f1f77bcf86cd799439011",
                      "segment_key": "trial-users"
                    }
                  ],
                  "view_key": "user-segments-view"
                }
        argumentDocs:
            environment_id: (String) The environment ID of the segment.
            flags: (Set of String) A set of feature flag keys to link to the view.
            id: (String) The ID of this resource.
            project_key: (String) The project key. A change in this field will force the destruction of the existing resource and the creation of a new one.
            segment_key: (String) The key of the segment.
            segments: (Block Set) A set of segments to link to the view. Each segment is identified by its environment ID and segment key. (see below for nested schema)
            view_key: (String) The view key to link resources to. A change in this field will force the destruction of the existing resource and the creation of a new one.
            view_keys: attribute on launchdarkly_feature_flag resources
        importStatements: []
    launchdarkly_webhook:
        subCategory: ""
        description: Provides a LaunchDarkly webhook resource. This resource allows you to create and manage webhooks within your LaunchDarkly organization.
        name: launchdarkly_webhook
        title: launchdarkly_webhook Resource - launchdarkly
        examples:
            - name: example
              manifest: |-
                {
                  "name": "Example Webhook",
                  "on": true,
                  "statements": [
                    {
                      "actions": [
                        "*"
                      ],
                      "effect": "allow",
                      "resources": [
                        "proj/*:env/production:flag/*"
                      ]
                    },
                    {
                      "actions": [
                        "*"
                      ],
                      "effect": "allow",
                      "resources": [
                        "proj/test:env/production:segment/*"
                      ]
                    }
                  ],
                  "tags": [
                    "terraform"
                  ],
                  "url": "http://webhooks.com/webhook"
                }
        argumentDocs:
            actions: |-
                (List of String) The list of action specifiers defining the actions to which the statement applies.
                Either actions or not_actions must be specified. For a list of available actions read Actions reference.
            effect: (String) Either allow or deny. This argument defines whether the statement allows or denies access to the named resources and actions.
            id: (String) The ID of this resource.
            name: (String) The webhook's human-readable name.
            not_actions: (List of String) The list of action specifiers defining the actions to which the statement does not apply.
            not_resources: (List of String) The list of resource specifiers defining the resources to which the statement does not apply.
            "on": (Boolean) Specifies whether the webhook is enabled.
            resources: (List of String) The list of resource specifiers defining the resources to which the statement applies.
            secret: (String, Sensitive) The secret used to sign the webhook.
            statements: (Block List) List of policy statement blocks used to filter webhook events. For more information on webhook policy filters read Adding a policy filter. (see below for nested schema)
            tags: (Set of String) Tags associated with your resource.
            url: (String) The URL of the remote webhook.
        importStatements:
            - |-
              # LaunchDarkly webhooks can be imported using the webhook's 24 character ID
              terraform import launchdarkly_webhook.example 57c0af609969090743529967
